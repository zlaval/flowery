spring:
  application:
    name: flowery
  datasource:
    url: jdbc:h2:mem:flowerydb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    baseline-on-migrate: true
logging:
  level:
    org.springframework.jdbc.core: DEBUG
